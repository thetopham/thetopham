name: Validate Next upgrade

on:
  push:
    branches:
      - agent/next-15-security-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build
